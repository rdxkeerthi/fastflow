name: Release & Multi-Platform Publishing

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheels via Maturin
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --sdist
          sdist: ${{ matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu' }}

      - name: Upload Wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-wheels]
    steps:
      - uses: actions/checkout@v4

      - name: Download all built wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FastFlow ${{ github.ref_name }} - High-Performance Telemetry Engine
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*
          body: |
            ## FastFlow Release ${{ github.ref_name }} ⚡
            
            Ultra-High-Performance, Zero-Copy Network Telemetry & PCAP Engine engineered in Rust with native Python bindings via PyO3.
            
            ### Highlights in this Release
            - **Hardened Security & Zero-Crash Architecture**:
              - Protection against TCP option infinite loop Denial-of-Service (`CVE-Guard`).
              - RFC 1035 compression pointer loop cycle detection bitset.
              - RFC 1035 63-byte label and 255-byte name length caps.
              - Bounded IPv6 extension header traversal (depth limit 8).
              - Memory-mapped zero-copy out-of-bounds guards across all link layers.
            - **Streaming Iterator (`PacketIterator`)**:
              - Zero-allocation streaming over multi-gigabyte PCAPs (`for pkt in aggregator:`).
            - **Automated Security Anomaly Detection**:
              - Built-in heuristics for SYN Floods, Vertical Port Scans, and Subnet Sweeps.
            - **Bandwidth Timeline & Bucketing**:
              - Dynamic time-sliced throughput and bitrate computation.
            - **Shannon Entropy Analysis**:
              - Fast entropy calculation for detecting DGA domains and DNS tunneling exfiltration.
            - **Deterministic Real Test Datasets**:
              - Included in `tests/data/` with full documentation in `tests/README.md`.

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels]
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI via Trusted Publisher
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-crates-io:
    name: Publish fastflow-core to crates.io
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo Publish
        run: cargo publish --manifest-path crates/fastflow-core/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
