name: Release & Multi-Platform Publishing

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty to auto-detect from Cargo.toml, e.g. v0.2.0)'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheels via Maturin
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sdist: ${{ matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu' }}

      - name: Upload Wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  build-rust-package:
    name: Package Rust Crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Package fastflow-core
        run: cargo package --manifest-path crates/fastflow-core/Cargo.toml

      - name: Upload Rust Crate Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-crate
          path: target/package/*.crate

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-wheels, build-rust-package]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            VERSION=$(grep -m1 '^version =' Cargo.toml | cut -d '"' -f2)
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Download all built wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download Rust crate artifact
        uses: actions/download-artifact@v4
        with:
          name: rust-crate
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: FastFlow ${{ steps.release_info.outputs.tag }} - High-Performance Telemetry Engine
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: false
          files: dist/*
          body: |
            ## FastFlow Release ${{ steps.release_info.outputs.tag }} ⚡
            
            Ultra-High-Performance, Zero-Copy Network Telemetry & PCAP Engine engineered in Rust with native Python bindings via PyO3.
            
            ### Included Packages & Artifacts
            - **Python Package (`fastflow-pcap`)**: Pre-compiled ABI3 wheels for Linux (`x86_64`, `aarch64`), macOS (`Intel`, `Apple Silicon`), and Windows (`x64`), along with source distribution.
            - **Rust Crate (`fastflow-core`)**: Source crate archive `.crate` for crates.io.
            - **GitHub Container Registry (ghcr.io)**: Pre-built Docker container image.
            
            ### Highlights in this Release
            - **Hardened Security & Zero-Crash Architecture**:
              - Protection against TCP option infinite loop Denial-of-Service (`CVE-Guard`).
              - RFC 1035 compression pointer loop cycle detection bitset.
              - RFC 1035 63-byte label and 255-byte name length caps.
              - Bounded IPv6 extension header traversal (depth limit 8).
              - Memory-mapped zero-copy out-of-bounds guards across all link layers.
            - **Streaming Iterator (`PacketIterator`)**:
              - Zero-allocation streaming over multi-gigabyte PCAPs (`for pkt in aggregator:`).
            - **Automated Security Anomaly Detection**:
              - Built-in heuristics for SYN Floods, Vertical Port Scans, and Subnet Sweeps.
            - **Bandwidth Timeline & Bucketing**:
              - Dynamic time-sliced throughput and bitrate computation.
            - **Shannon Entropy Analysis**:
              - Fast entropy calculation for detecting DGA domains and DNS tunneling exfiltration.
            - **Deterministic Real Test Datasets**:
              - Included in `tests/data/` with full documentation in `tests/README.md`.

  publish-github-packages:
    name: Publish to GitHub Packages (ghcr.io)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Determine Docker Metadata
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            VERSION=$(grep -m1 '^version =' Cargo.toml | cut -d '"' -f2)
            TAG="v${VERSION}"
          fi
          echo "image=ghcr.io/${REPO_LOWER}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container to GitHub Packages
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels]
    environment:
      name: pypi
      url: https://pypi.org/p/fastflow-pcap
    permissions:
      id-token: write
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI (via API Token)
        if: env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Publish to PyPI (via Trusted Publisher OIDC)
        if: env.PYPI_API_TOKEN == ''
        uses: pypa/gh-action-pypi-publish@release/v1
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          packages-dir: dist/
          skip-existing: true

  publish-crates-io:
    name: Publish fastflow-core to crates.io
    runs-on: ubuntu-latest
    needs: [build-rust-package]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check token presence and publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            cargo publish --manifest-path crates/fastflow-core/Cargo.toml
          else
            echo "::warning::CARGO_REGISTRY_TOKEN secret is not set in repository settings. Skipping crates.io publish."
          fi
