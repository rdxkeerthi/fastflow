name: Test & Lint Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust-check:
    name: Rust Security, Format & Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (Strict Zero-Warning Lints)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Core Tests
        run: cargo test -p fastflow-core --verbose

      - name: Security Audit (cargo-audit)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  python-binding-test:
    name: Python Bindings & ABI3 Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Maturin, Pytest & Linters
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest ruff mypy

      - name: Build and Install Local Extension
        run: pip install .

      - name: Type Check (mypy)
        run: mypy python/fastflow

      - name: Python Linter (ruff)
        run: ruff check python/

      - name: Run Python Integration Tests
        run: pytest tests/
