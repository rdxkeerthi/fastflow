[workspace]
members = [
    "crates/fastflow-core",
    "crates/fastflow-py",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["rdxkeerthi <keerthi@fastflow.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rdxkeerthi/fastflow"
homepage = "https://github.com/rdxkeerthi/fastflow"
readme = "README.md"
keywords = ["pcap", "zero-copy", "network", "telemetry", "packet-parser"]
categories = ["network-programming", "parser-implementations"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
